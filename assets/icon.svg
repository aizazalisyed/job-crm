<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jarvis arc reactor">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#132a3a"/>
      <stop offset="1" stop-color="#060b12"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cdfaff"/>
      <stop offset="1" stop-color="#36c6e6"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- outer housing ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#0c3242" stroke-width="4"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#3fd0ec" stroke-width="1.3" opacity="0.8"/>

  <!-- coil segments around the core -->
  <g filter="url(#glow)" stroke="#9fe9f7" stroke-width="3.4" stroke-linecap="round">
    <line x1="32" y1="13.5" x2="32" y2="19"/>
    <line x1="44.8" y1="18.6" x2="41" y2="22.5"/>
    <line x1="50.5" y1="32" x2="45" y2="32"/>
    <line x1="44.8" y1="45.4" x2="41" y2="41.5"/>
    <line x1="32" y1="50.5" x2="32" y2="45"/>
    <line x1="19.2" y1="45.4" x2="23" y2="41.5"/>
    <line x1="13.5" y1="32" x2="19" y2="32"/>
    <line x1="19.2" y1="18.6" x2="23" y2="22.5"/>
  </g>

  <!-- inner glowing ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#1f9fc4" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="11.5" fill="#0a1a24" stroke="#7fe3f6" stroke-width="1.6" filter="url(#glow)"/>

  <!-- triangular reactor core -->
  <path d="M32 24 L39.8 37.5 H24.2 Z" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow)"/>
</svg>
